
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive temple picture album created by Joshua Salami for WDD 131.">
    <meta name="author" content="Joshua Salami">

    <title>Temple Album | Joshua Salami</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

<body>

    <header>
        <div class="header-content">
            <h2>Temple Album</h2>

            <button id="menu-button" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="navigation">
                ☰
            </button>
        </div>

        <nav id="navigation">
            <a href="temples.html">Home</a>
            <a href="#old">Old</a>
            <a href="#new">New</a>
            <a href="#large">Large</a>
            <a href="#small">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Gallery</h1>

        <div class="temple-grid">

            <figure id="old">
                <img src="images/temple-1.webp" alt="Accra Ghana Temple" loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-2.webp" alt="Aba Nigeria Temple" loading="lazy">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-3.webp" alt="Lagos Nigeria Temple" loading="lazy">
                <figcaption>Lagos Nigeria Temple</figcaption>
            </figure>

            <figure id="new">
                <img src="images/temple-4.webp" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-5.webp" alt="London England Temple" loading="lazy">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-6.webp" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure id="large">
                <img src="images/temple-7.webp" alt="Washington DC Temple" loading="lazy">
                <figcaption>Washington DC Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-8.webp" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure id="small">
                <img src="images/temple-9.webp" alt="Freiberg Germany Temple" loading="lazy">
                <figcaption>Freiberg Germany Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Joshua Salami | Nigeria</p>
