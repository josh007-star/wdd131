

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by selecting a product, rating its performance, and sharing your experience.">
    <meta name="author" content="Joshua Salami">
    <title>Product Review Form | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
        <p>Share your experience with a product.</p>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="productName">
                    Product Name <span class="required">*</span>
                </label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-options">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span>☆</span>
                        <small>1</small>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span>☆☆</span>
                        <small>2</small>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span>☆☆☆</span>
                        <small>3</small>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span>☆☆☆☆</span>
                        <small>4</small>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span>☆☆☆☆☆</span>
                        <small>5</small>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installationDate">
                    Date of Installation <span class="required">*</span>
                </label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>

            <fieldset>
                <legend>Useful Features</legend>
                <p class="field-description">Which features did you find useful? (Check all that apply)</p>

                <div class="checkbox-group">
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="easeOfUse">
                        <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us about your experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName" autocomplete="name" placeholder="Enter your name">
            </div>

            <input type="submit" value="Submit Review" class="submit-button">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Joshua Salami | Nigeria</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
